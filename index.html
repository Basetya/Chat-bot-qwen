<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Bot Pribadi</title>
  <style>
    :root {
      --primary: #0d6efd;
      --bg: #f5f7fa;
      --surface: #ffffff;
      --bot: #e9ecef;
      --text: #212529;
      --muted: #6c757d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      background: var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }

    .chat-wrapper {
      width: 100%;
      max-width: 480px;
      height: calc(100vh - 40px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--surface);
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
    }

    .header {
      padding: 16px;
      background: var(--primary);
      color: #fff;
      text-align: center;
      font-weight: 600;
    }

    .kb-editor {
      padding: 16px;
      border-top: 1px solid #e9ecef;
      background: #f8f9fa;
    }

    .kb-editor textarea {
      width: 100%;
      min-height: 120px;
      border: 1px solid #ced4da;
      border-radius: 8px;
      padding: 10px;
      font: inherit;
      resize: vertical;
      background: #fff;
      color: #212529;
    }

    .kb-editor button,
    .file-uploader button {
      margin-top: 10px;
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font: inherit;
      cursor: pointer;
    }

    .file-uploader {
      margin-top: 16px;
    }

    .file-uploader input[type="file"] {
      width: 100%;
      margin-top: 8px;
    }

    .kb-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .kb-actions button {
      background: #198754;
    }

    .kb-actions button:nth-child(2) {
      background: #0d6efd;
    }

    .kb-editor .status,
    .file-uploader .status,
    #fileList {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.95rem;
      white-space: pre-wrap;
    }

    #chatbox {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px;
      overflow-y: auto;
      background: #fafafa;
    }

    .msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user {
      align-self: flex-end;
      background: var(--primary);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .bot {
      align-self: flex-start;
      background: var(--bot);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .typing {
      align-self: flex-start;
      padding: 6px 10px;
      color: var(--muted);
      font-style: italic;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: var(--surface);
      border-top: 1px solid #eee;
    }

    #input {
      flex: 1;
      min-width: 0;
      padding: 10px;
      border: 1px solid #ced4da;
      border-radius: 8px;
      font: inherit;
      outline: none;
    }

    #input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.14);
    }

    #send {
      flex: 0 0 auto;
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
    }

    #send:disabled {
      background: #adb5bd;
      cursor: not-allowed;
    }

    @media (max-width: 520px) {
      body {
        padding: 0;
      }

      .chat-wrapper {
        height: 100vh;
        max-width: none;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <div class="chat-wrapper">
    <div class="header">Chat Bot Pribadi</div>
    <div class="kb-editor">
      <label for="kbText"><strong>Knowledge Base</strong> (edit informasi bisnis, produk, FAQ, kontak):</label>
      <textarea id="kbText" placeholder="Tulis atau tempel knowledge base di sini..."></textarea>
      <button id="saveKb">Simpan Knowledge Base</button>
      <div id="kbStatus" class="status"></div>
      <div class="file-uploader">
        <label for="fileInput"><strong>Upload file</strong> (txt / md / csv / json / pdf / xls / xlsx / docx / png / jpg / jpeg didukung):</label>
        <input type="file" id="fileInput" accept=".txt,.md,.csv,.json,.pdf,.xls,.xlsx,.docx,.png,.jpg,.jpeg" />
        <button id="uploadFile">Upload & Tambahkan</button>
        <div id="fileStatus" class="status"></div>
      </div>
      <div class="kb-actions">
        <button id="resetKb" type="button">Reset Knowledge Base</button>
        <button id="refreshFiles" type="button">Refresh Daftar File</button>
      </div>
      <div id="fileList"></div>
    </div>
    <div id="chatbox"></div>
    <div class="input-area">
      <input type="text" id="input" placeholder="Ketik pesan..." autocomplete="off">
      <button id="send" type="button">Kirim</button>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyHf_AKnXO8bO1YV4oy7giZYPc-XQmKh_OPhSdKLhBtqZ7t64SzWcuxYOm2b2YQgg6h/exec";

    const chatbox = document.getElementById("chatbox");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    function addMessage(text, sender) {
      const div = document.createElement("div");
      div.className = `msg ${sender}`;
      div.textContent = text;
      chatbox.appendChild(div);
      chatbox.scrollTop = chatbox.scrollHeight;
    }

    function showTyping() {
      const div = document.createElement("div");
      div.className = "typing";
      div.id = "typing";
      div.textContent = "Mengetik...";
      chatbox.appendChild(div);
      chatbox.scrollTop = chatbox.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById("typing");
      if (el) el.remove();
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";
      sendBtn.disabled = true;
      showTyping();

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ message: text }),
          headers: { "Content-Type": "application/json;charset=utf-8" }
        });

        const data = await res.json();
        hideTyping();
        addMessage(data.response || "Terjadi kesalahan.", "bot");
      } catch (err) {
        hideTyping();
        addMessage("Gagal terhubung ke server.", "bot");
        console.error(err);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") sendMessage();
    });

    var saveKbBtn = document.getElementById("saveKb");
    var resetKbBtn = document.getElementById("resetKb");
    var refreshFilesBtn = document.getElementById("refreshFiles");
    var kbText = document.getElementById("kbText");
    var kbStatus = document.getElementById("kbStatus");
    var fileList = document.getElementById("fileList");

    saveKbBtn.addEventListener("click", saveKnowledgeBase);
    resetKbBtn.addEventListener("click", resetKnowledgeBase);
    refreshFilesBtn.addEventListener("click", loadUploadedFiles);

    loadKnowledgeBase();
    loadUploadedFiles();

    async function loadKnowledgeBase() {
      kbStatus.textContent = "Memuat knowledge base...";
      try {
        var res = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ action: "get_knowledge" }),
          headers: { "Content-Type": "application/json;charset=utf-8" }
        });
        var data = await res.json();
        kbText.value = data.response || "";
        kbStatus.textContent = "Knowledge base dimuat.";
      } catch (err) {
        kbStatus.textContent = "Gagal memuat knowledge base.";
        console.error(err);
      }
    }

    async function resetKnowledgeBase() {
      if (!confirm("Reset knowledge base ke default? Semua konten custom akan hilang.")) {
        return;
      }
      resetKbBtn.disabled = true;
      kbStatus.textContent = "Mereset knowledge base...";
      try {
        var res = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ action: "reset_knowledge" }),
          headers: { "Content-Type": "application/json;charset=utf-8" }
        });
        var data = await res.json();
        kbStatus.textContent = data.response || "Knowledge base telah direset.";
        loadKnowledgeBase();
      } catch (err) {
        kbStatus.textContent = "Gagal mereset knowledge base.";
        console.error(err);
      } finally {
        resetKbBtn.disabled = false;
      }
    }

    async function loadUploadedFiles() {
      fileList.textContent = "Memuat daftar file...";
      try {
        var res = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ action: "list_files" }),
          headers: { "Content-Type": "application/json;charset=utf-8" }
        });
        var data = await res.json();
        if (Array.isArray(data.response) && data.response.length) {
          fileList.innerHTML = data.response.map(function(file) {
            return '<div><strong>' + file.name + '</strong> (' + Math.round(file.size / 1024) + ' KB) - ' + file.date + ' <button data-id="' + file.id + '" class="delete-file">Hapus</button></div>';
          }).join('');
          fileList.querySelectorAll('.delete-file').forEach(function(button) {
            button.addEventListener('click', function() {
              deleteFile(button.getAttribute('data-id'));
            });
          });
        } else {
          fileList.textContent = 'Belum ada file terunggah.';
        }
      } catch (err) {
        fileList.textContent = "Gagal memuat daftar file.";
        console.error(err);
      }
    }

    async function deleteFile(fileId) {
      if (!confirm('Hapus file ini dari Drive?')) {
        return;
      }
      try {
        var res = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ action: "delete_file", file_id: fileId }),
          headers: { "Content-Type": "application/json;charset=utf-8" }
        });
        var data = await res.json();
        fileStatus.textContent = data.response || 'File dihapus.';
        loadUploadedFiles();
      } catch (err) {
        fileStatus.textContent = 'Gagal menghapus file.';
        console.error(err);
      }
    }

    async function saveKnowledgeBase() {
      var text = kbText.value.trim();
      if (!text) {
        kbStatus.textContent = "Isi knowledge base terlebih dahulu.";
        return;
      }

      saveKbBtn.disabled = true;
      kbStatus.textContent = "Menyimpan...";

      try {
        var res = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ action: "set_knowledge", kb_text: text }),
          headers: { "Content-Type": "application/json;charset=utf-8" }
        });

        var data = await res.json();
        kbStatus.textContent = data.response || "Knowledge base disimpan.";
      } catch (err) {
        kbStatus.textContent = "Gagal menyimpan knowledge base.";
        console.error(err);
      } finally {
        saveKbBtn.disabled = false;
      }
    }

    async function uploadFile() {
      var file = fileInput.files[0];
      if (!file) {
        fileStatus.textContent = "Pilih file terlebih dahulu.";
        return;
      }

      uploadFileBtn.disabled = true;
      fileStatus.textContent = "Mengunggah file...";

      var reader = new FileReader();
      reader.onload = async function (event) {
        var base64 = event.target.result.split(",")[1];
        try {
          var res = await fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify({
              action: "upload_file",
              filename: file.name,
              content_type: file.type || "application/octet-stream",
              file_data: base64
            }),
            headers: { "Content-Type": "application/json;charset=utf-8" }
          });

          var data = await res.json();
          fileStatus.textContent = data.response || "File berhasil diunggah.";
        } catch (err) {
          fileStatus.textContent = "Gagal mengunggah file.";
          console.error(err);
        } finally {
          uploadFileBtn.disabled = false;
        }
      };
      reader.readAsDataURL(file);
    }

    var fileInput = document.getElementById("fileInput");
    var uploadFileBtn = document.getElementById("uploadFile");
    var fileStatus = document.getElementById("fileStatus");
    uploadFileBtn.addEventListener("click", uploadFile);

    input.focus();
  </script>
</body>
</html>
