<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot GAS + Vercel</title>
  <style>
    :root {
      --primary: #0d6efd;
      --bg: #f5f7fa;
      --surface: #ffffff;
      --bot: #e9ecef;
      --text: #212529;
      --muted: #6c757d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      background: var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }

    .chat-wrapper {
      width: 100%;
      max-width: 480px;
      height: calc(100vh - 40px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--surface);
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
    }

    .header {
      padding: 16px;
      background: var(--primary);
      color: #fff;
      text-align: center;
      font-weight: 600;
    }

    #chatbox {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px;
      overflow-y: auto;
      background: #fafafa;
    }

    .msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user {
      align-self: flex-end;
      background: var(--primary);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .bot {
      align-self: flex-start;
      background: var(--bot);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .typing {
      align-self: flex-start;
      padding: 6px 10px;
      color: var(--muted);
      font-style: italic;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: var(--surface);
      border-top: 1px solid #eee;
    }

    #input {
      flex: 1;
      min-width: 0;
      padding: 10px;
      border: 1px solid #ced4da;
      border-radius: 8px;
      font: inherit;
      outline: none;
    }

    #input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.14);
    }

    #send {
      flex: 0 0 auto;
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
    }

    #send:disabled {
      background: #adb5bd;
      cursor: not-allowed;
    }

    @media (max-width: 520px) {
      body {
        padding: 0;
      }

      .chat-wrapper {
        height: 100vh;
        max-width: none;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <div class="chat-wrapper">
    <div class="header">Chatbot GAS + Vercel</div>
    <div id="chatbox"></div>
    <div class="input-area">
      <input type="text" id="input" placeholder="Ketik pesan..." autocomplete="off">
      <button id="send" type="button">Kirim</button>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyHf_AKnXO8bO1YV4oy7giZYPc-XQmKh_OPhSdKLhBtqZ7t64SzWcuxYOm2b2YQgg6h/exec";

    const chatbox = document.getElementById("chatbox");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    function addMessage(text, sender) {
      const div = document.createElement("div");
      div.className = `msg ${sender}`;
      div.textContent = text;
      chatbox.appendChild(div);
      chatbox.scrollTop = chatbox.scrollHeight;
    }

    function showTyping() {
      const div = document.createElement("div");
      div.className = "typing";
      div.id = "typing";
      div.textContent = "Mengetik...";
      chatbox.appendChild(div);
      chatbox.scrollTop = chatbox.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById("typing");
      if (el) el.remove();
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";
      sendBtn.disabled = true;
      showTyping();

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ message: text }),
          headers: { "Content-Type": "text/plain;charset=utf-8" }
        });

        const data = await res.json();
        hideTyping();
        addMessage(data.response || "Terjadi kesalahan.", "bot");
      } catch (err) {
        hideTyping();
        addMessage("Gagal terhubung ke server.", "bot");
        console.error(err);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") sendMessage();
    });
    input.focus();
  </script>
</body>
</html>
